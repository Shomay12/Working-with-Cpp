<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTypes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
  </defs>

  <style>
    @keyframes scanH {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .pulse-glow { animation: scanH 2s ease-in-out infinite; }
  </style>

  <rect width="900" height="280" rx="12" fill="url(#bgTypes)" stroke="#1a273b" stroke-width="1.5"/>

  <!-- Title bar -->
  <text x="35" y="32" class="mono" font-size="12" font-weight="800" fill="#00f0ff" letter-spacing="2">
    BITSTREAM ARCHITECTURE • IEEE-754 &amp; LOW-LEVEL PRIMITIVES
  </text>
  <text x="865" y="32" text-anchor="end" class="mono" font-size="11" fill="#4d6582">
    ARCH: 64-BIT LITTLE ENDIAN
  </text>
  <line x1="35" y1="45" x2="865" y2="45" stroke="#1c2d44" stroke-width="1" />

  <!-- 1. Float IEEE-754 (32-bit) -->
  <g transform="translate(40, 65)">
    <text x="0" y="15" class="mono" font-size="11" font-weight="700" fill="#ffffff">
      FLOAT <tspan fill="#627d9d">(32-bit Single Precision IEEE-754)</tspan>
    </text>
    
    <!-- Sign (1 bit) -->
    <rect x="0" y="24" width="30" height="28" rx="4" fill="#ff0055" fill-opacity="0.2" stroke="#ff0055" stroke-width="1"/>
    <text x="15" y="42" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ff0055">S</text>
    
    <!-- Exponent (8 bits) -->
    <rect x="35" y="24" width="220" height="28" rx="4" fill="#ffa657" fill-opacity="0.2" stroke="#ffa657" stroke-width="1"/>
    <text x="145" y="42" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ffa657">EXPONENT (8 BITS)</text>
    
    <!-- Mantissa (23 bits) -->
    <rect x="260" y="24" width="560" height="28" rx="4" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1"/>
    <text x="540" y="42" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#00f0ff">MANTISSA / FRACTION (23 BITS)</text>
  </g>

  <!-- 2. Integer Signed vs Unsigned (32-bit) -->
  <g transform="translate(40, 140)">
    <text x="0" y="15" class="mono" font-size="11" font-weight="700" fill="#ffffff">
      INT &amp; UNSIGNED INT <tspan fill="#627d9d">(Two's Complement Binary Layout)</tspan>
    </text>

    <!-- Sign bit -->
    <rect x="0" y="24" width="30" height="28" rx="4" fill="#d2a8ff" fill-opacity="0.2" stroke="#d2a8ff" stroke-width="1"/>
    <text x="15" y="42" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#d2a8ff">+/-</text>

    <!-- Value bits (31 bits) -->
    <rect x="35" y="24" width="785" height="28" rx="4" fill="#39ff14" fill-opacity="0.15" stroke="#39ff14" stroke-width="1"/>
    <text x="427" y="42" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#39ff14">
      MAGNITUDE (31 BITS) ——&gt; IN UNSIGNED: REINTERPRETED AS 2^31 WEIGHT
    </text>
  </g>

  <!-- 3. 64-bit Pointer Virtual Address -->
  <g transform="translate(40, 215)">
    <text x="0" y="15" class="mono" font-size="11" font-weight="700" fill="#ffffff">
      POINTER (*) <tspan fill="#627d9d">(64-bit Virtual Memory Address Segment)</tspan>
    </text>

    <rect x="0" y="22" width="820" height="24" rx="4" fill="#0e182a" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="410" y="38" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#00f0ff">
      0x00007FFEE4B201A8 • DIRECT MEMORY ADDRESS BUS (STACK FRAME REGISTER)
    </text>
  </g>
</svg>

