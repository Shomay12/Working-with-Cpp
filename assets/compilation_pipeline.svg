<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140205" />
      <stop offset="100%" stop-color="#090103" />
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="10" fill="url(#pipeBg)" stroke="#4a0b14" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#ff003c" letter-spacing="2">
    LLVM CLANG CODEGEN &amp; COMPILATION PIPELINE
  </text>
  <text x="870" y="30" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff8da1">
    ARM64 MACH-O TARGET
  </text>
  <line x1="30" y1="42" x2="870" y2="42" stroke="#380810" stroke-width="1"/>

  <!-- Static Connecting Bus -->
  <line x1="100" y1="115" x2="800" y2="115" stroke="#2b050d" stroke-width="4"/>

  <!-- Animated Data Flow Line -->
  <line x1="100" y1="115" x2="800" y2="115" stroke="#ff003c" stroke-width="2" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" from="64" to="0" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Step 1: Source Files -->
  <g transform="translate(35, 65)">
    <rect width="140" height="100" rx="6" fill="#1c0307" stroke="#ff1744" stroke-width="1.5"/>
    <text x="70" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ff1744">PHASE 1</text>
    <text x="70" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">SOURCE CODE</text>
    <text x="70" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff8da1">.cpp / .hpp files</text>
    <text x="70" y="84" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffcdd2">UTF-8 Plain Text</text>
  </g>

  <!-- Step 2: Preprocessor -->
  <g transform="translate(205, 65)">
    <rect width="140" height="100" rx="6" fill="#1c0307" stroke="#ff003c" stroke-width="1.5"/>
    <text x="70" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ff003c">PHASE 2</text>
    <text x="70" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">PREPROCESSOR</text>
    <text x="70" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff8da1">#include macro exp</text>
    <text x="70" y="84" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffcdd2">Eigen3 resolution</text>
  </g>

  <!-- Step 3: LLVM IR & Clang -->
  <g transform="translate(375, 65)">
    <rect width="150" height="100" rx="6" fill="#1c0307" stroke="#d50000" stroke-width="1.5"/>
    <text x="75" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#d50000">PHASE 3</text>
    <text x="75" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">LLVM CLANG</text>
    <text x="75" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff8da1">Lexer • Parser • AST</text>
    <text x="75" y="84" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffcdd2">Bitcode IR gen</text>
  </g>

  <!-- Step 4: Optimization -->
  <g transform="translate(555, 65)">
    <rect width="145" height="100" rx="6" fill="#1c0307" stroke="#b71c1c" stroke-width="1.5"/>
    <text x="72" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#b71c1c">PHASE 4</text>
    <text x="72" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">OPTIMIZATION</text>
    <text x="72" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff8da1">-O3 Vectorization</text>
    <text x="72" y="84" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffcdd2">Neon SIMD loops</text>
  </g>

  <!-- Step 5: Linker -->
  <g transform="translate(730, 65)">
    <rect width="135" height="100" rx="6" fill="#2d050c" stroke="#ff003c" stroke-width="2"/>
    <text x="67" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ff003c">PHASE 5</text>
    <text x="67" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">MACH-O BINARY</text>
    <text x="67" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff8da1">Symbol resolution</text>
    <text x="67" y="84" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff3366">EXEC READY</text>
  </g>

  <!-- Bottom Execution Note -->
  <text x="450" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff8da1">
    PIPELINE COMMAND: clang++ -std=c++17 -O3 -I/opt/homebrew/include/eigen3 v2.cpp -o v2
  </text>
</svg>
