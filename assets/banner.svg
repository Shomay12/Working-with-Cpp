<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="redBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140205" />
      <stop offset="50%" stop-color="#24050b" />
      <stop offset="100%" stop-color="#0a0103" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff003c" />
      <stop offset="50%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff003c" />
    </linearGradient>
  </defs>

  <!-- Background Panel -->
  <rect width="900" height="240" rx="10" fill="url(#redBg)" stroke="#ff003c" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
  </rect>

  <!-- Red Grid Overlay -->
  <g stroke="#380810" stroke-width="0.75" opacity="0.6">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="450" y1="0" x2="450" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="750" y1="0" x2="750" y2="240" />
  </g>

  <!-- Animated Laser Scanline (SMIL) -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#ff003c" stroke-width="2" opacity="0.75">
    <animate attributeName="y1" values="40;235;40" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="40;235;40" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#redGlow)" />

  <!-- Terminal Titlebar -->
  <rect x="0" y="4" width="900" height="34" fill="#1c0307" stroke="#3d0911" stroke-width="1"/>
  <circle cx="22" cy="21" r="5" fill="#ff1744" />
  <circle cx="38" cy="21" r="5" fill="#d50000" />
  <circle cx="54" cy="21" r="5" fill="#880e4f" />

  <text x="450" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#ff6b81" letter-spacing="2">
    LLVM CLANG // ARM64 ARCHITECTURE // C++ SYSTEMS KERNEL
  </text>

  <!-- Hero Typography -->
  <text x="50" y="95" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="3">
    C++ <tspan fill="#ff003c">SYSTEMS</tspan> ENGINE
  </text>
  <text x="50" y="125" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#ff6b81" letter-spacing="1.5">
    DIRECT MEMORY ALLOCATION • HARDWARE REGISTERS • ZERO-COST ABSTRACTIONS
  </text>

  <!-- Console Card -->
  <rect x="50" y="145" width="800" height="68" rx="6" fill="#0d0103" stroke="#4a0b14" stroke-width="1.2"/>
  <text x="70" y="172" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700" fill="#ff003c">
    $ <tspan fill="#ffffff">clang++ -std=c++20 -O3 -Wall -Wextra -I/opt/homebrew/include/eigen3 engine.cpp -o core</tspan>
  </text>
  <text x="70" y="196" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#ff8da1">
    [TARGET: MACH-O 64-BIT ARM64] Memory Pages: 4096B • Direct Pointer Manipulation Active<tspan fill="#ff003c">_</tspan>
    <animate attributeName="fill-opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
  </text>

  <!-- Right Telemetry Badge -->
  <rect x="690" y="55" width="160" height="65" rx="5" fill="#140205" stroke="#ff003c" stroke-width="1"/>
  <text x="705" y="75" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="700" fill="#ff003c" letter-spacing="1">STATE: ONLINE</text>
  <text x="705" y="92" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#ffcdd2">RAM: UNIFIED BUS</text>
  <text x="705" y="107" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#ffcdd2">SIMD: NEON 128B</text>
  <circle cx="832" cy="72" r="4" fill="#ff003c">
    <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
