<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="radar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(-300px); }
      100% { transform: translateY(300px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulsePath {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 1; }
    }
    @keyframes dataPulse {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .scanline { animation: scan 4s linear infinite; }
    .cursor { animation: blink 1s infinite; }
    .pulse-line { animation: pulsePath 3s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8, 12; animation: dataPulse 2s linear infinite; }
  </style>

  <!-- Background Panel -->
  <rect width="900" height="300" rx="14" fill="url(#bgGrad)" stroke="#1a2638" stroke-width="2"/>
  
  <!-- Subtle Grid Overlay -->
  <g stroke="#162235" stroke-width="0.75" opacity="0.6">
    <line x1="0" y1="50" x2="900" y2="50" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="150" x2="900" y2="150" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="250" x2="900" y2="250" />
    <line x1="150" y1="35" x2="150" y2="300" />
    <line x1="300" y1="35" x2="300" y2="300" />
    <line x1="450" y1="35" x2="450" y2="300" />
    <line x1="600" y1="35" x2="600" y2="300" />
    <line x1="750" y1="35" x2="750" y2="300" />
  </g>

  <!-- Animated Scanline -->
  <g class="scanline" pointer-events="none">
    <rect x="0" y="0" width="900" height="40" fill="url(#radar)" />
  </g>

  <!-- Terminal Window Titlebar -->
  <rect width="900" height="36" rx="14" fill="#0c1322" stroke="#1f2d42" stroke-width="1"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56" />
  <circle cx="42" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="18" r="6" fill="#27c93f" />

  <text x="450" y="23" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#627d9d" letter-spacing="2">
    LLVM-CLANG // ARM64 COMPUTE ENGINE // ZERO-COST RUNTIME
  </text>

  <!-- Top Accent Glowing Strip -->
  <line x1="0" y1="36" x2="900" y2="36" stroke="url(#cyanGlow)" stroke-width="1.5" class="pulse-line" />

  <!-- Hero Typography -->
  <text x="50" y="95" class="mono" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="3" filter="url(#glow)">
    C++ <tspan fill="#00f0ff">SYSTEMS</tspan> ENGINE
  </text>
  <text x="50" y="125" class="mono" font-size="13" font-weight="600" fill="#00f0ff" letter-spacing="1.5">
    DIRECT HARDWARE MAPPING &bull; HEAP/STACK DYNAMICS &bull; HIGH THROUGHPUT
  </text>

  <!-- Terminal Command Prompt Box -->
  <rect x="50" y="150" width="800" height="110" rx="8" fill="#040711" stroke="#1e2c40" stroke-width="1.2" />

  <!-- Interactive Terminal Logs -->
  <text x="75" y="180" class="mono" font-size="13" font-weight="700" fill="#39ff14">
    $ <tspan fill="#ffffff">clang++ -O3 -std=c++20 -march=armv8.5-a -I/opt/homebrew/include/eigen3 engine.cpp -o runtime</tspan>
  </text>
  <text x="75" y="206" class="mono" font-size="12" fill="#627d9d">
    [LLVM-IR] <tspan fill="#00f0ff">Vectorizing inner loops...</tspan> <tspan fill="#39ff14">DONE (Neon 128-bit SIMD)</tspan>
  </text>
  <text x="75" y="228" class="mono" font-size="12" fill="#627d9d">
    [MEMORY]  <tspan fill="#ffa657">Virtual Address Space Initialized</tspan> &bull; Zero Overhead Allocation
  </text>
  <text x="75" y="248" class="mono" font-size="12" fill="#39ff14">
    [STATUS]  <tspan fill="#ffffff">Ready. Direct Pointer Manipulation Active</tspan><tspan class="cursor" fill="#00f0ff">_</tspan>
  </text>

  <!-- Right Decorative Telemetry Panel -->
  <rect x="680" y="55" width="170" height="75" rx="6" fill="#060b17" stroke="#1c2b42" stroke-width="1"/>
  <text x="695" y="75" class="mono" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="1">TELEMETRY</text>
  <text x="695" y="93" class="mono" font-size="11" fill="#c9d1d9">PAGE: <tspan fill="#39ff14">4096 BYTES</tspan></text>
  <text x="695" y="110" class="mono" font-size="11" fill="#c9d1d9">ALIGN: <tspan fill="#00f0ff">64-BIT QUAD</tspan></text>
  <circle cx="830" cy="72" r="4" fill="#39ff14" filter="url(#glow)"/>
</svg>
